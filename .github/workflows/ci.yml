name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  stdlib:
    name: stdlib (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core
        run: python -m pip install -e .
      - name: Run full suite including skill sync and family examples
        run: python -m unittest discover -s tests -v

  optional-node:
    name: PDF and icon deck (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install core and optional Node helpers
        run: |
          python -m pip install -e .
          npm ci --prefix node
      - name: Run full suite with PDF golden and family formats
        run: python -m unittest discover -s tests -v

  optional-mcp:
    name: MCP SDK 1.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MCP extra
        run: python -m pip install -e ".[mcp]"
      - name: Test SDK registration, browser routes, access, and billing
        run: python -m unittest tests.test_mcp_platform tests.test_browser_ui tests.test_hosted_access tests.test_billing -v

  mcp-container:
    name: MCP container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployable image
        run: docker build --tag archdiagram-mcp:test .
      - name: Start the Streamable HTTP MCP server
        run: docker run --detach --rm --name archdiagram-mcp-test -e PORT=8080 -e ARCHDIAGRAM_ACCESS_MODE=disabled -p 8080:8080 archdiagram-mcp:test
      - name: Confirm the MCP endpoint accepts connections
        run: |
          for _ in {1..20}; do
            if curl --silent --output /dev/null --connect-timeout 1 http://localhost:8080/mcp; then
              exit 0
            fi
            sleep 1
          done
          docker logs archdiagram-mcp-test
          exit 1
      - name: Stop test container
        if: always()
        run: docker stop archdiagram-mcp-test || true
