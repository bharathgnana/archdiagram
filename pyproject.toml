[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archdiagram"
version = "0.2.0"
description = "Render architecture, process, decision, and data flow specs as editable diagrams."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bharath Adapa" }]
keywords = ["architecture", "process", "decision", "dataflow", "workflow", "swimlane", "diagram", "drawio", "vsdx", "pdf", "svg", "pptx", "aws", "azure", "gcp", "kubernetes", "lucidchart"]

# Core has ZERO third-party Python dependencies (stdlib only).
dependencies = []

[project.optional-dependencies]
# The MCP server subpackage is the ONLY place the mcp SDK is used.
mcp = ["mcp>=1.28,<2"]

[project.scripts]
archdiagram = "archdiagram.cli:main"

[tool.setuptools]
packages = [
    "archdiagram",
    "archdiagram.spec",
    "archdiagram.layout",
    "archdiagram.registry",
    "archdiagram.registry.catalog_data",
    "archdiagram.emit",
    "archdiagram.rasterize",
    "mcp_server",
    "tools",
]

[tool.setuptools.package-data]
"archdiagram.registry" = ["catalog_data/*.json"]
"archdiagram.emit" = ["pptx_parts/*.xml"]
"mcp_server" = ["web_assets/*"]
